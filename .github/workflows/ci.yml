name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync --group dev

      - name: Lint Python
        run: uv run ruff check ml/src/guandan/dart web/backend/app examples

      - name: Type check DART
        run: uv run mypy

      - name: Run ML tests
        run: uv run pytest -q ml/tests

      - name: Run web backend tests
        run: uv run pytest -q web/backend/tests
