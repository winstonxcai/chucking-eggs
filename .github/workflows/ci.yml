name: CI

on:
  push:
    paths:
      - ".github/workflows/ci.yml"
      - "examples/**"
      - "ml/src/**"
      - "ml/tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - "web/backend/**"
      - "web/frontend/**"
  pull_request:
    paths:
      - ".github/workflows/ci.yml"
      - "examples/**"
      - "ml/src/**"
      - "ml/tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - "web/backend/**"
      - "web/frontend/**"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync --group dev

      - name: Build Rust extension
        run: uv run maturin develop --release --manifest-path ml/src/guandan_rs/Cargo.toml

      - name: Lint Python
        run: uv run ruff check ml/src/guandan web/backend/app examples

      - name: Type check core Python
        run: uv run mypy

      - name: Audit Python dependencies
        run: >
          uv run pip-audit
          --ignore-vuln PYSEC-2025-210
          --ignore-vuln PYSEC-2025-194
          --ignore-vuln PYSEC-2025-196
          --ignore-vuln PYSEC-2025-195
          --ignore-vuln PYSEC-2025-193
          --ignore-vuln PYSEC-2025-192
          --ignore-vuln PYSEC-2026-139
          --ignore-vuln PYSEC-2025-191
          --ignore-vuln PYSEC-2025-197
          --ignore-vuln PYSEC-2025-189
          --ignore-vuln PYSEC-2025-190

      - name: Run ML tests
        run: uv run pytest -q ml/tests

      - name: Run DART CPU smoke
        run: >
          uv run python -m guandan.dart
          --config ml/src/guandan/dart/configs/dart_cpu_smoke.yaml
          --updates 5
          --run-dir /tmp/dart_cpu_smoke_ci

      - name: Run web backend tests
        run: uv run pytest -q web/backend/tests

  frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v7

      - name: Install backend dependencies for E2E
        run: uv sync --group dev

      - uses: actions/setup-node@v4
        with:
          node-version-file: web/frontend/.nvmrc
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: web/frontend
        run: npm ci

      - name: Lint frontend
        working-directory: web/frontend
        run: npm run lint

      - name: Run frontend unit tests
        working-directory: web/frontend
        run: npm run test:unit

      - name: Build frontend
        working-directory: web/frontend
        run: npm run build

      - name: Install Playwright browsers
        working-directory: web/frontend
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E
        working-directory: web/frontend
        run: npm run e2e

      - name: Run Playwright integration E2E
        working-directory: web/frontend
        run: npm run e2e:integration
