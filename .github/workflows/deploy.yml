name: Deploy to Fly.io

on:
  push:
    branches:
      - main
    paths:
      - "web/backend/**"
      - "ml/src/**"
      - "fly.toml"
      - ".dockerignore"
      - "docker-compose.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - run: flyctl deploy --remote-only --wait-timeout 120
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
