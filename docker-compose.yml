services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build:
      context: .
      dockerfile: web/backend/Dockerfile
    ports:
      - "8000:8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app/web/backend/app --reload-dir /app/src
    environment:
      - ALLOWED_ORIGINS=http://localhost:3000
      - MONGODB_URL=mongodb://mongo:27017
      - PYTHONPATH=/app/src:/app/web/backend
    depends_on:
      - mongo
    volumes:
      - ./src:/app/src:ro
      - ./web/backend/app:/app/web/backend/app:ro
      - ./data:/app/data
      - ./checkpoints:/app/checkpoints:ro

  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    volumes:
      - ./web/frontend:/app
    depends_on:
      - backend

volumes:
  mongo_data:
