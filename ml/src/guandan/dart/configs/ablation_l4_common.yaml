# Shared 10-hour L4 ablation recipe.
# The four ablation files inherit this config and override only model_type and
# is_partner_visible.

n_actors: 32
actor_batch_lanes: 64
sync_interval_updates: 5000
sync_jitter_updates: 1000
actor_push_batch_size: 512
sample_queue_maxsize: 64
max_drain_batches_per_loop: 16
actor_queue_full_policy: block
actor_queue_put_timeout_s: 5.0
actor_queue_full_log_every: 12
publish_interval_updates: 200
checkpoint_every_updates: 25000
checkpoint_save_type: weight
log_every_updates: 10

eval:
  enabled: true
  opponents: [yaoji, ez, jidan, strategic]
  n_eval_games_per_opponent: 1000
  every_updates: 0
  workers: 0
  lanes: 0
  device: cpu
  max_wait_s: 300.0

# Locked model construction values for both implementations. These are not
# experimental axes; only model_type and is_partner_visible vary per run.
model_type: Dart
is_partner_visible: true

# DART architecture.
dart_role_d_model: 128
dart_history_hidden: 256
dart_global_hidden: 128
dart_action_hidden: 128
dart_trunk_hidden: 1024
dart_trunk_layers: 4

# GuanZero architecture.
hidden_lstm: 256
hidden_mlp: 1024
n_mlp_layers: 6
dropout: 0.0
history_encoder: lstm
transformer_nhead: 4
transformer_layers: 2
transformer_ff_dim: 1024

target_replay_ratio: 1.0
max_replay_ratio: 1.25
max_throttle_sleep_s: 0.05

lr: 3.0e-5
gamma: 1.0
batch_size: 4096
batch_size_semantics: total
buffer_capacity: 400000
buffer_capacity_per_player: 100000
buffer_min_size: 32768

epsilon_start: 0.01
epsilon_final: 0.01
epsilon_decay_updates: 0

opponents:
  latest_learner_team_odd_probability: 0.5
  episode_mix:
    self_play: 1.0
    frozen_pool: 0.0
    hard_bot: 0.0
  frozen_pool:
    checkpoints: []
    epsilon: 0.0
    sampling: uniform
  hard_bot:
    bots: []
    sampling:
      type: uniform
      weights: {}

max_forced_pass_replay_frac: 0.0
coordination_bucket_card_threshold: 5
coordination_bucket_final_fraction: 0.6666666667

device: cuda
use_bf16_learner: true
compile_mode: default
max_train_seconds: 36000
total_updates_target: 0
