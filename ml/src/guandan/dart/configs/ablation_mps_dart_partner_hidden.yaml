# MPS DART partner-hidden ablation config.
# Matches the active 50k local MPS partner-hidden run.
#
# Launch:
#   uv run python -m guandan.dart \
#     --config ml/src/guandan/dart/configs/ablation_mps_dart_partner_hidden.yaml \
#     --updates 50000 --run-dir ml/runs/ablation_mps_dart_partner_hidden_50k

n_actors: 4
actor_batch_lanes: 20
sync_interval_updates: 1000
sync_jitter_updates: 250
actor_push_batch_size: 512
sample_queue_maxsize: 256
max_drain_batches_per_loop: 64
actor_queue_full_policy: block
actor_queue_put_timeout_s: 5.0
actor_queue_full_log_every: 12
publish_interval_updates: 200
checkpoint_every_updates: 10000
checkpoint_save_type: weight
log_every_updates: 10

eval:
  enabled: true
  opponents: [yaoji, ez, jidan, strategic]
  n_eval_games_per_opponent: 1000
  every_updates: 0
  workers: 0
  lanes: 0
  device: cpu

model_type: Dart
dart_role_d_model: 128
dart_history_hidden: 256
dart_global_hidden: 128
dart_action_hidden: 128
dart_trunk_hidden: 1024
dart_trunk_layers: 4
dropout: 0.0

target_replay_ratio: 1.0
max_replay_ratio: 1.25
max_throttle_sleep_s: 0.05

lr: 3.0e-5
gamma: 1.0
batch_size: 2048
buffer_capacity: 400000
buffer_capacity_per_player: 100000
buffer_min_size: 4096

epsilon_start: 0.05
epsilon_final: 0.01
epsilon_decay_updates: 50000
is_partner_visible: false

opponents:
  latest_learner_team_odd_probability: 0.5
  episode_mix:
    self_play: 1.0
    frozen_pool: 0.0
    hard_bot: 0.0
  frozen_pool:
    checkpoints: []
    epsilon: 0.0
    sampling: uniform
  hard_bot:
    bots: []
    sampling:
      type: uniform
      weights: {}

max_forced_pass_replay_frac: 0
coordination_bucket_card_threshold: 5
coordination_bucket_final_fraction: 0.6666666667

device: mps
use_bf16_learner: false
compile_mode: default
