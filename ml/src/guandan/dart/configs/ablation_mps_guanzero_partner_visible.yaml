# MPS GuanZero partner-visible ablation config.
# Uses the same local MPS runtime/training/eval schedule as the DART ablations.
#
# Launch:
#   uv run python -m guandan.dart \
#     --config ml/src/guandan/dart/configs/ablation_mps_guanzero_partner_visible.yaml \
#     --updates 50000 --run-dir ml/runs/ablation_mps_guanzero_partner_visible_50k

n_actors: 4
actor_batch_lanes: 20
sync_interval_updates: 1000
sync_jitter_updates: 250
actor_push_batch_size: 512
sample_queue_maxsize: 256
max_drain_batches_per_loop: 64
actor_queue_full_policy: block
actor_queue_put_timeout_s: 5.0
actor_queue_full_log_every: 12
publish_interval_updates: 200
checkpoint_every_updates: 10000
checkpoint_save_type: weight
log_every_updates: 10

eval:
  enabled: true
  opponents: [yaoji, ez, jidan, strategic]
  n_eval_games_per_opponent: 1000
  every_updates: 0
  workers: 0
  lanes: 0
  device: cpu

model_type: GuanZero
hidden_lstm: 256
hidden_mlp: 1024
n_mlp_layers: 6
dropout: 0.0
history_encoder: lstm
transformer_nhead: 4
transformer_layers: 2
transformer_ff_dim: 1024

target_replay_ratio: 1.0
max_replay_ratio: 1.25
max_throttle_sleep_s: 0.05

lr: 3.0e-5
gamma: 1.0
batch_size: 2048
batch_size_semantics: per_seat  # Legacy GuanZero behavior: 2048 samples per seat.
buffer_capacity: 400000
buffer_capacity_per_player: 100000
buffer_min_size: 4096

epsilon_start: 0.05
epsilon_final: 0.01
epsilon_decay_updates: 50000
is_partner_visible: true

opponents:
  latest_learner_team_odd_probability: 0.5
  episode_mix:
    self_play: 1.0
    frozen_pool: 0.0
    hard_bot: 0.0
  frozen_pool:
    checkpoints: []
    epsilon: 0.0
    sampling: uniform
  hard_bot:
    bots: []
    sampling:
      type: uniform
      weights: {}

max_forced_pass_replay_frac: 0
coordination_bucket_card_threshold: 5
coordination_bucket_final_fraction: 0.6666666667

device: mps
use_bf16_learner: false
compile_mode: default
