# Dart — L4 GPU training (32 vCPU actors, CUDA learner).
# Actor-bound at ~1.8 upd/s steady-state. ~$2.50/hr on Modal.
#
# Launch:
#   modal run --detach ml/scripts/modal/train_dart_modal.py \
#     --config-path /root/ml/src/guandan/dart/configs/dart_l4.yaml \
#     --updates 50000 --run-name dart_l4_50k --seed 0

n_actors: 32
actor_batch_lanes: 40
sync_interval_updates: 5000
sync_jitter_updates: 1000
actor_push_batch_size: 512
sample_queue_maxsize: 64
max_drain_batches_per_loop: 16
publish_interval_updates: 200
checkpoint_every_updates: 25000
checkpoint_save_type: weight
log_every_updates: 10
updates_per_learner_step: 1

eval:
  enabled: true
  opponents: [yaoji, ez, jidan, strategic]
  n_eval_games_per_opponent: 10000
  every_updates: 0  # 0 = checkpoint_every_updates
  workers: 0        # 0 = n_actors
  lanes: 0          # 0 = actor_batch_lanes
  device: cpu

model_type: Dart
dart_role_d_model: 128
dart_history_hidden: 256
dart_global_hidden: 128
dart_action_hidden: 128
dart_trunk_hidden: 1024
dart_trunk_layers: 4
dropout: 0.0

target_replay_ratio: 1.0
max_replay_ratio: 1.25
max_throttle_sleep_s: 0.05

lr: 3.0e-5
gamma: 1.0
batch_size: 4096
buffer_capacity: 400000
buffer_capacity_per_player: 100000
buffer_min_size: 32768

epsilon_start: 0.01
epsilon_final: 0.01
epsilon_decay_updates: 20000
is_partner_visible: true

opponents:
  latest_team_odd_probability: 0.5
  episode_mix:
    self_play: 1.0
    frozen_pool: 0.0
    hard_bot: 0.0
  frozen_pool:
    checkpoints: []
    epsilon: 0.0
    sampling: uniform
  hard_bot:
    bots: []
    sampling:
      type: uniform
      weights: {}

max_forced_k1_replay_frac: 0.0

device: cuda
use_bf16_learner: true
compile_mode: reduce-overhead
