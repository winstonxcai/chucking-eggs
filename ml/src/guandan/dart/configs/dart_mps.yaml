# Dart — local MPS training (6 CPU actors, MPS learner).
# Actor-bound. ~50% vs strategic in ~6h on M1 Pro.
#
# Launch:
#   uv run python -m guandan.dart \
#     --config ml/src/guandan/dart/configs/dart_mps.yaml \
#     --updates 10000 --run-dir ml/runs/dart_mps_10k

n_actors: 6
actor_batch_lanes: 8
sync_interval_updates: 1000
sync_jitter_updates: 250
actor_push_batch_size: 512
sample_queue_maxsize: 64
max_drain_batches_per_loop: 16
publish_interval_updates: 200
checkpoint_every_updates: 2500
checkpoint_save_type: weight
log_every_updates: 10
updates_per_learner_step: 1

model_type: Dart
dart_role_d_model: 128
dart_history_hidden: 256
dart_global_hidden: 128
dart_action_hidden: 128
dart_trunk_hidden: 1024
dart_trunk_layers: 4
dropout: 0.0

target_replay_ratio: 1.0
max_replay_ratio: 1.25
max_throttle_sleep_s: 0.05

lr: 3.0e-5
gamma: 1.0
batch_size: 2048
buffer_capacity: 400000
buffer_capacity_per_player: 100000
buffer_min_size: 32768

epsilon_start: 0.01
epsilon_final: 0.01
epsilon_decay_updates: 20000
is_partner_visible: true

opponents:
  latest_team_odd_probability: 0.5
  episode_mix:
    self_play: 1.0
    frozen_pool: 0.0
    hard_bot: 0.0
  frozen_pool:
    checkpoints: []
    epsilon: 0.0
    sampling: uniform
  hard_bot:
    bots: []
    sampling:
      type: uniform
      weights: {}

max_forced_k1_replay_frac: 0.05

device: mps
use_bf16_learner: false
compile_mode: default
