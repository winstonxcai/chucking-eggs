# Dart — local MPS training (4 CPU actors, MPS learner).
# 200-update local sweep on 2026-05-26 found 4 actors × 16 lanes fastest
# among complete runs with the current queue/drain settings.
#
# Launch:
#   uv run python -m guandan.dart \
#     --config ml/src/guandan/dart/configs/dart_mps.yaml \
#     --updates 10000 --run-dir ml/runs/dart_mps_10k

n_actors: 4
actor_batch_lanes: 16
sync_interval_updates: 1000
sync_jitter_updates: 250
actor_push_batch_size: 512
sample_queue_maxsize: 256
max_drain_batches_per_loop: 64
actor_queue_full_policy: block
actor_queue_put_timeout_s: 5.0
actor_queue_full_log_every: 12
publish_interval_updates: 200
checkpoint_every_updates: 2500
checkpoint_save_type: weight
log_every_updates: 10

eval:
  enabled: false
  opponents: all
  n_eval_games_per_opponent: 200
  every_updates: 0  # 0 = checkpoint_every_updates
  workers: 0        # 0 = n_actors
  lanes: 0          # 0 = actor_batch_lanes
  device: cpu

model_type: Dart
dart_role_d_model: 128
dart_history_hidden: 256
dart_global_hidden: 128
dart_action_hidden: 128
dart_trunk_hidden: 1024
dart_trunk_layers: 4
dropout: 0.0

target_replay_ratio: 1.0
max_replay_ratio: 1.25
max_throttle_sleep_s: 0.05

lr: 3.0e-5
gamma: 1.0
batch_size: 2048
buffer_capacity: 400000
buffer_capacity_per_player: 100000
buffer_min_size: 4096

epsilon_start: 0.01
epsilon_final: 0.01
epsilon_decay_updates: 20000
is_partner_visible: true

opponents:
  latest_learner_team_odd_probability: 0.5
  episode_mix:
    self_play: 1.0
    frozen_pool: 0.0
    hard_bot: 0.0
  frozen_pool:
    checkpoints: []
    epsilon: 0.0
    sampling: uniform
  hard_bot:
    bots: []
    sampling:
      type: uniform
      weights: {}

max_forced_pass_replay_frac: 0.05
coordination_bucket_card_threshold: 5
coordination_bucket_final_fraction: 0.6666666667

device: mps
use_bf16_learner: false
compile_mode: default
