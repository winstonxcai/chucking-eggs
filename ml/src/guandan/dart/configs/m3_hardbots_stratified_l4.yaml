# Stratified-replay continuation, branched from dart_hardbots_25k @ 45k.
#
# Pairs experiment (45k→55k) failed: yaoji regressed to 47.6% (below coin-flip).
# Root cause: mixed-pair distribution shift induced catastrophic forgetting.
#
# This run restarts from 45k with a fresh optimizer + fresh replay buffer and
# introduces stratified replay sampling to oversample hard-bot loss episodes —
# especially losses to yaoji (the persistent bottleneck at ~55.7% since phase B).
#
# Bucket mix at 0.50/0.50 with ~50% latest WR:
#   ~50% of buffer rows are vs-hard-bot.
#   Of those: ~50% are yaoji episodes (yaoji=0.45 of hard-bot sampling).
#   → ~22% of buffer rows are yaoji episodes total.
#   Stratified replay oversamples losses: hard_bot_loss (20%) +
#   yaoji_endgame_coordination_loss (10%) together are 30% of each minibatch
#   but represent a smaller share of buffer rows — roughly 2-3× oversampling
#   of loss situations vs uniform.
#
# Launch:
#   modal run --detach ml/scripts/modal/train_dart_modal.py \
#     --config-path /root/ml/src/guandan/dart/configs/m3_hardbots_stratified_l4.yaml \
#     --updates 50000 \
#     --run-name dart_hardbots_stratified \
#     --resume /runs/dart/dart_hardbots_25k/checkpoints/update_00045000.pt \
#     --seed 0

n_actors: 32
sync_interval_updates: 500
sync_jitter_updates: 100
actor_push_batch_size: 512
sample_queue_maxsize: 64
max_drain_batches_per_loop: 16
publish_interval_updates: 200
checkpoint_every_updates: 5000
log_every_updates: 10
updates_per_learner_step: 1

model_type: shared_heads
shared_head_role_d_model: 128
shared_head_history_hidden: 256
shared_head_global_hidden: 128
shared_head_action_hidden: 128
shared_head_trunk_hidden: 1024
shared_head_trunk_layers: 4
dropout: 0.0

use_inference_server: false
inference_device: cuda
inference_batch_max_requests: 32
inference_batch_max_action_rows: 4096
inference_batch_timeout_ms: 5.0
inference_max_actions: 512
inference_n_slots: 512

target_replay_ratio: 1.0
max_replay_ratio: 1.25
max_throttle_sleep_s: 0.05

lr: 1.0e-4
gamma: 1.0
batch_size: 4096
buffer_capacity: 400000
buffer_capacity_per_player: 100000
buffer_min_size: 8192

fresh_optimizer: true
fresh_replay: true

# ── Epsilon ──
epsilon_latest: 0.02
epsilon_bot: 0.00

is_partner_visible: true

# ── Hard-bot self-play, yaoji-heavy ──
latest_vs_latest_frac: 0.50
latest_vs_hard_bot_frac: 0.50

hard_bot_pool:
  - strategic
  - yaoji
  - jidan

hard_bot_sampling:
  strategic: 0.15
  yaoji: 0.45
  jidan: 0.40

# ── Stratified replay mix ──
# Note: hard_bot_loss and yaoji_endgame_coordination_loss buckets were removed
# from the valid key set; their weights folded into hard_bot_general.
replay_mix:
  general: 0.55
  hard_bot_general: 0.45

device: cuda
use_bf16_learner: true
compile_mode: reduce-overhead
