# GuanZero M0 — distributed actor-learner DMC, tuned for Modal A10G + 32 vCPU.
# M1 baseline (post non_blocking fix, LOGBOOK §43): ~4096 samp/s (8 upd/s × 512).
# A10G batch=4096 bench (LOGBOOK §44): ~10977 samp/s (2.68 upd/s × 4096) — ~2.7× M1.
# Throughput metric is samples/sec (batch-size-independent).

n_actors: 16
sync_interval_episodes: 20
actor_push_batch_size: 512
sample_queue_maxsize: 64
max_drain_batches_per_loop: 16
publish_interval_updates: 200
checkpoint_every_updates: 5000
log_every_updates: 2
updates_per_learner_step: 1

# Network (paper spec — same as M1)
hidden_lstm: 256
hidden_mlp: 1024
n_mlp_layers: 6
dropout: 0.0

# Training
lr: 1.0e-4
gamma: 1.0
batch_size: 2048
buffer_capacity_per_player: 100000
buffer_min_size: 5000
epsilon_start: 0.1
epsilon_final: 0.01
epsilon_decay_episodes: 15000
max_legal_actions: 320
use_oracle_others_hand: true

# A10G throughput
device: cuda
use_bf16_learner: true
# reduce-overhead uses CUDA graphs (stream-pinned); learner auto-downgrades to
# "default" on CUDA so per-position streams can run in parallel.
compile_mode: reduce-overhead
