# GuanZero M0 baseline — paper-faithful DMC.
# Hyperparameters chosen to match arXiv:2402.13582 §4 where stated;
# reasonable defaults elsewhere. See ml/src/guandan/guanzero/train.py
# for the canonical TrainConfig dataclass.

seed: 0
episodes: 30000

gamma: 1.0
batch_size: 512
lr: 1.0e-4

epsilon_start: 0.1
epsilon_final: 0.01
epsilon_decay_episodes: 15000

learn_every_episodes: 4
log_every_episodes: 100
checkpoint_every_episodes: 5000

buffer_capacity_per_player: 50000
buffer_min_size: 1000

hidden_lstm: 256
hidden_mlp: 1024
n_mlp_layers: 6
dropout: 0.0

# Paper-faithful: the others_hand channel is oracle-style. M4 (belief)
# will flip this to false and replace with a learned belief channel.
use_oracle_others_hand: true
history_window: 20
max_legal_actions: 128

device: cpu
run_dir: ml/runs/guanzero_m0
