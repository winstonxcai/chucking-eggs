# GuanZero — distributed actor-learner DMC, tuned for Modal L4 + 32 vCPU.
# Identical to m0_l4_distributed.yaml except use_oracle_others_hand: false —
# the agent gets no privileged info about which specific cards each opponent
# holds. Used for ablating the oracle channel against a fair baseline.
# Throughput metric is samples/sec (batch-size-independent).

n_actors: 32
sync_interval_updates: 20
actor_push_batch_size: 512
sample_queue_maxsize: 64
max_drain_batches_per_loop: 16
publish_interval_updates: 200
checkpoint_every_updates: 5000
log_every_updates: 10
updates_per_learner_step: 1

# ── Shared-GPU inference ──
# Regresses paper-spec throughput by ~36% due to IPC + GPU contention
# exceeding local CPU forward cost at small K. Default OFF for paper-spec;
# flip to true for larger-model ablations where forward dominates IPC.
use_inference_server: false
inference_device: cuda
inference_batch_max_requests: 32
inference_batch_max_action_rows: 4096
inference_batch_timeout_ms: 5.0
inference_max_actions: 512
inference_n_slots: 512

# ── Replay-ratio controller ──
# Throttles the learner when cum_replay > max_replay_ratio so we don't
# overfit to a small slow-growing buffer. At n_actors=32 the learner
# consumes samples ~12-22× faster than actors produce them, training
# mostly on stale data without this throttle.
#
# Early in training the policy is changing quickly and stale samples
# carry obsolete behavior — replay ≈ 1 keeps each gradient step near
# on-policy data. As training matures replay can drift up without
# hurting eval (a 200k-update checkpoint trained at ~2.5× was published).
#
# Conservative defaults: target ≈ 1, hard cap at 1.0. Bump
# max_replay_ratio later in long runs once the policy stabilizes.
target_replay_ratio: 1.0
max_replay_ratio: 1.0
max_throttle_sleep_s: 0.05

# Network (paper spec)
hidden_lstm: 256
hidden_mlp: 1024
n_mlp_layers: 6
dropout: 0.0

# Training
lr: 1.0e-4
gamma: 1.0
batch_size: 4096
buffer_capacity_per_player: 100000
buffer_min_size: 5000
epsilon_start: 0.05
epsilon_final: 0.05
epsilon_decay_updates: 0
use_oracle_others_hand: false

# L4 throughput
device: cuda
use_bf16_learner: true
# reduce-overhead uses CUDA graphs (stream-pinned); learner auto-downgrades to
# "default" on CUDA so per-position streams can run in parallel.
compile_mode: reduce-overhead
