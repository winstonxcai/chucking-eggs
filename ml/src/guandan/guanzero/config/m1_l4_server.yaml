# GuanZero M1 — Transformer + shared GPU inference server (bench variant).
# Identical to m1_l4_no_server.yaml except use_inference_server: true.

n_actors: 32
sync_interval_updates: 20
actor_push_batch_size: 512
sample_queue_maxsize: 64
max_drain_batches_per_loop: 16
publish_interval_updates: 200
checkpoint_every_updates: 5000
log_every_updates: 10
updates_per_learner_step: 1

# ── Shared-GPU inference ──
use_inference_server: true
inference_device: cuda
inference_batch_max_requests: 32
inference_batch_max_action_rows: 4096
inference_batch_timeout_ms: 5.0
inference_max_actions: 512
inference_n_slots: 512

# ── Replay-ratio controller ──
target_replay_ratio: 1.0
max_replay_ratio: 1.0
max_throttle_sleep_s: 0.05

# Network (paper spec + transformer history encoder)
hidden_lstm: 256
hidden_mlp: 1024
n_mlp_layers: 6
dropout: 0.0
history_encoder: transformer
transformer_nhead: 4
transformer_layers: 2
transformer_ff_dim: 1024

# Training
lr: 1.0e-4
gamma: 1.0
batch_size: 4096
buffer_capacity_per_player: 100000
buffer_min_size: 5000
epsilon_start: 0.05
epsilon_final: 0.05
epsilon_decay_updates: 0
use_oracle_others_hand: true

# L4 throughput
device: cuda
use_bf16_learner: true
compile_mode: reduce-overhead
