# Targeted yaoji/jidan endgame coordination replay
# Branches from guanzero_hardbots_25k @ 45k
#
# Per-sample bucket tagging replaces the previous per-episode 4-bucket scheme.
# Sampling buckets use overlapping inclusion rules:
#   general              -> all samples (uniform)
#   hard_bot_general     -> samples with bucket >= 1 (any vs-hard-bot)
#   coordination_endgame -> samples tagged as endgame coord (bucket == 2;
#                           computed per-sample on yaoji/jidan loss episodes)
#
# Launch:
#   modal run --detach ml/scripts/modal/train_guanzero_modal.py \
#     --config-path /root/ml/src/guandan/guanzero/config/m3_coord_endgame_l4.yaml \
#     --updates 50000 \
#     --run-name guanzero_coord_endgame \
#     --resume /runs/guanzero/guanzero_hardbots_25k/checkpoints/update_00045000.pt \
#     --seed 0

n_actors: 32
sync_interval_updates: 500
sync_jitter_updates: 100
actor_push_batch_size: 512
sample_queue_maxsize: 64
max_drain_batches_per_loop: 16
publish_interval_updates: 200
checkpoint_every_updates: 5000
log_every_updates: 10
updates_per_learner_step: 1

model_type: shared_heads
shared_head_role_d_model: 128
shared_head_history_hidden: 256
shared_head_global_hidden: 128
shared_head_action_hidden: 128
shared_head_trunk_hidden: 1024
shared_head_trunk_layers: 4
dropout: 0.0

use_inference_server: false
inference_device: cuda
inference_batch_max_requests: 32
inference_batch_max_action_rows: 4096
inference_batch_timeout_ms: 5.0
inference_max_actions: 512
inference_n_slots: 512

target_replay_ratio: 1.0
max_replay_ratio: 1.25
max_throttle_sleep_s: 0.05

lr: 1.0e-4
gamma: 1.0
batch_size: 4096
buffer_capacity: 400000
buffer_capacity_per_player: 100000
buffer_min_size: 8192

fresh_optimizer: true
fresh_replay: true

# ── Epsilon ──
epsilon_latest: 0.02
epsilon_bot: 0.00

is_partner_visible: true

# ── Hard-bot self-play ──
latest_vs_latest_frac: 0.50
latest_vs_hard_bot_frac: 0.50
latest_odd_probability: 0.60

hard_bot_pool:
  - strategic
  - yaoji
  - jidan

hard_bot_sampling:
  strategic: 0.10
  yaoji: 0.50
  jidan: 0.40

# ── Stratified replay mix (overlapping inclusion rules) ──
replay_mix:
  general: 0.65
  hard_bot_general: 0.15
  coordination_endgame: 0.20

device: cuda
use_bf16_learner: true
compile_mode: reduce-overhead
