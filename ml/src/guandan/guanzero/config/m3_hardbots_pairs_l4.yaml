# Mixed hard-bot pairs continuation, branched from guanzero_hardbots_25k @ 45k.
#
# Same opponent pool (strategic, yaoji, jidan) but two opponent seats can now
# be different bot types, expanding from 3 to 6 distinct opponent
# configurations. Goal: break the over-fit-to-homogeneous-pair dynamic that
# caused the 45k→55k regression in the previous run.
#
# Self-play / vs-hard-bot split shifted to 0.45 / 0.55 (was 0.40 / 0.60) —
# the diversity gain from mixed pairs is large enough that we can afford
# slightly less hard-bot fraction overall.
#
# Sample-mix math at 0.45/0.55 with ~50% latest WR: ~50% of buffer rows are
# vs-hard-bot. Mixed pairs (yaoji+jidan, yaoji+strategic, jidan+strategic)
# are 0.45 of all hard-bot episodes → ~22% of all buffer rows have a mixed
# opponent team, a regime the 45k checkpoint never saw.
#
# Launch:
#   modal run --detach ml/scripts/modal/train_guanzero_modal.py \
#     --config-path /root/ml/src/guandan/guanzero/config/m3_hardbots_pairs_l4.yaml \
#     --updates 55000 \
#     --run-name guanzero_hardbots_pairs \
#     --resume /runs/guanzero/guanzero_hardbots_25k/checkpoints/update_00045000.pt \
#     --seed 0

n_actors: 32
sync_interval_updates: 500
sync_jitter_updates: 100
actor_push_batch_size: 512
sample_queue_maxsize: 64
max_drain_batches_per_loop: 16
publish_interval_updates: 200
checkpoint_every_updates: 5000
log_every_updates: 10
updates_per_learner_step: 1

model_type: shared_heads
shared_head_role_d_model: 128
shared_head_history_hidden: 256
shared_head_global_hidden: 128
shared_head_action_hidden: 128
shared_head_trunk_hidden: 1024
shared_head_trunk_layers: 4
dropout: 0.0

use_inference_server: false
inference_device: cuda
inference_batch_max_requests: 32
inference_batch_max_action_rows: 4096
inference_batch_timeout_ms: 5.0
inference_max_actions: 512
inference_n_slots: 512

target_replay_ratio: 1.0
max_replay_ratio: 1.25
max_throttle_sleep_s: 0.05

lr: 1.0e-4
gamma: 1.0
batch_size: 4096
buffer_capacity: 400000
buffer_capacity_per_player: 100000
buffer_min_size: 8192

# ── Epsilon (latest only; bots are deterministic Agent.act calls) ──
epsilon_start: 0.02
epsilon_final: 0.02
epsilon_decay_updates: 0
epsilon_frozen: 0.00
use_oracle_others_hand: true

# ── Hard-bot mixed-opponent self-play with PAIR sampling ──
latest_vs_latest_frac: 0.45
latest_vs_hard_bot_frac: 0.55

hard_bot_pool:
  - strategic
  - yaoji
  - jidan

# Pair sampling. Keys are "<a>_<b>" alphabetized.
# 3 homogeneous pairs (0.55 mass) + 3 mixed pairs (0.45 mass).
hard_bot_pair_sampling:
  jidan_jidan:         0.20
  strategic_strategic: 0.10
  yaoji_yaoji:         0.25
  jidan_strategic:     0.10
  jidan_yaoji:         0.25
  strategic_yaoji:     0.10

device: cuda
use_bf16_learner: true
compile_mode: reduce-overhead
