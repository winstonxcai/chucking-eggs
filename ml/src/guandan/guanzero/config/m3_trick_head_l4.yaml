# GuanZero M3 v3 — trick-leader-relative heads (new shared_trick_heads variant).
#
# Same hyperparameters as m3_partner_10k_l4.yaml (M3 v2) for a clean A/B
# comparison. The only architectural difference is model_type:
# shared_trick_heads, which routes the 4 heads by actor-position-relative-to-
# trick-leader instead of absolute seat, and drops the seat_emb.
#
# Expected outcome: even/odd WR gap on yaoji/jidan drops (was 10.6/6.8pp at v2
# 10k); combined WR matches or beats v2 within ±2pp on all 7 bots.
#
# Launch:
#   modal run --detach ml/scripts/modal/train_guanzero_modal.py \
#     --config-path /root/ml/src/guandan/guanzero/config/m3_trick_head_l4.yaml \
#     --updates 10000 \
#     --run-name guanzero_trick_head_10k \
#     --seed 0

n_actors: 32
sync_interval_updates: 500
sync_jitter_updates: 100
actor_push_batch_size: 512
sample_queue_maxsize: 64
max_drain_batches_per_loop: 16
publish_interval_updates: 200
checkpoint_every_updates: 2500
log_every_updates: 10
updates_per_learner_step: 1

model_type: shared_trick_heads
shared_head_role_d_model: 128
shared_head_history_hidden: 256
shared_head_global_hidden: 128
shared_head_action_hidden: 128
shared_head_trunk_hidden: 1024
shared_head_trunk_layers: 4
dropout: 0.0

use_inference_server: false
inference_device: cuda
inference_batch_max_requests: 32
inference_batch_max_action_rows: 4096
inference_batch_timeout_ms: 5.0
inference_max_actions: 512
inference_n_slots: 512

target_replay_ratio: 1.0
max_replay_ratio: 1.5
max_throttle_sleep_s: 0.05

lr: 1.0e-4
gamma: 1.0
batch_size: 4096
buffer_capacity: 400000
buffer_capacity_per_player: 100000
buffer_min_size: 32768

epsilon_start: 0.10
epsilon_final: 0.03
epsilon_decay_updates: 50000
is_partner_visible: true

latest_vs_latest_frac: 1.0
latest_vs_hard_bot_frac: 0.0

device: cuda
use_bf16_learner: true
compile_mode: reduce-overhead
