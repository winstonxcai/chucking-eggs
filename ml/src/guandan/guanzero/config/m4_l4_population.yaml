# GuanZero M4 — checkpoint-population self-play branched from M3 20k.
#
# Half of episodes remain pure self-play (all 4 seats use the latest network).
# The other half pit the latest on one team against a frozen checkpoint sampled
# per-episode from the pool, with frozen seats playing greedy (ε=0). Only
# latest-team samples enter the buffer — frozen actions are opponents, not
# teachers.
#
# Launch:
#   modal run --detach ml/scripts/modal/train_guanzero_modal.py \
#     --config-path /root/ml/src/guandan/guanzero/config/m4_l4_population.yaml \
#     --updates 30000 \
#     --run-name guanzero_m4_population_30k \
#     --resume /runs/guanzero/guanzero_m3_10k_no_server/checkpoints/update_00020000.pt \
#     --seed 0

n_actors: 32
sync_interval_updates: 500    # tighter than M3 — less ε noise → latest must track learner closer
sync_jitter_updates: 100      # per-actor jitter spread thresholds across [400, 600]
actor_push_batch_size: 512
sample_queue_maxsize: 64
max_drain_batches_per_loop: 16
publish_interval_updates: 200
checkpoint_every_updates: 5000
log_every_updates: 10
updates_per_learner_step: 1

model_type: shared_heads
shared_head_role_d_model: 128
shared_head_history_hidden: 256
shared_head_global_hidden: 128
shared_head_action_hidden: 128
shared_head_trunk_hidden: 1024
shared_head_trunk_layers: 4
dropout: 0.0

use_inference_server: false
inference_device: cuda
inference_batch_max_requests: 32
inference_batch_max_action_rows: 4096
inference_batch_timeout_ms: 5.0
inference_max_actions: 512
inference_n_slots: 512

target_replay_ratio: 1.0
max_replay_ratio: 1.5
max_throttle_sleep_s: 0.05

lr: 1.0e-4
gamma: 1.0
batch_size: 4096
buffer_capacity: 400000
buffer_capacity_per_player: 100000
buffer_min_size: 8192

# ── Epsilon split ──
# Latest seats keep light exploration noise; frozen opponents play their
# actual deterministic policy (no noise, so they're the policy not a noisy
# version of it).
epsilon_start: 0.02
epsilon_final: 0.02
epsilon_decay_updates: 0
epsilon_frozen: 0.00
is_partner_visible: true

# ── Population self-play ──
# 50% episodes self-play / 50% vs frozen → ~67% self-play / 33% vs-frozen
# in buffer (self-play episodes contribute 4 seats, vs-frozen contribute 2).
# If the result is a partial gain, drop to 0.33 next (≈ equal sample mass).
latest_vs_latest_frac: 0.5
population_pool:
  - /runs/guanzero/guanzero_m3_10k_no_server/checkpoints/update_00005000.pt
  - /runs/guanzero/guanzero_m3_10k_no_server/checkpoints/update_00010000.pt
  - /runs/guanzero/guanzero_m3_10k_no_server/checkpoints/update_00015000.pt
  - /runs/guanzero/guanzero_m3_10k_no_server/checkpoints/update_00020000.pt

device: cuda
use_bf16_learner: true
compile_mode: reduce-overhead
