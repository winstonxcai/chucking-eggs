# GuanZero — faithful persistent actor-learner DMC
# Tuned for M1 Pro (8 P-cores, paper-spec net, MPS learner). n_actors=1 is the
# optimum (end-to-end sweeps): N≥4 starves the MPS-dispatching learner of CPU.
# With n_actors=1, BLAS thread limit is also a no-op — let torch pick the default.
# Steady-state ~8 upd/s after the non_blocking H2D fix in collate{,_encoded}.

n_actors: 1
sync_interval_updates: 20
actor_push_batch_size: 512
sample_queue_maxsize: 64
max_drain_batches_per_loop: 32
publish_interval_updates: 100
checkpoint_every_updates: 5000
log_every_updates: 200
updates_per_learner_step: 1

# Network (paper spec)
hidden_lstm: 256
hidden_mlp: 1024
n_mlp_layers: 6
dropout: 0.0

# Training
lr: 1.0e-4
gamma: 1.0
batch_size: 512
buffer_capacity_per_player: 50000
buffer_min_size: 5000
epsilon_start: 0.01
epsilon_final: 0.01
epsilon_decay_updates: 0
is_partner_visible: true

device: mps
# run_dir omitted — auto-generates ml/runs/guanzero_m0_YYYYMMDD_HHMM
