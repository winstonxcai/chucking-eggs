[project]
name = "guandan"
version = "0.1.0"
description = "Guan Dan (掼蛋) game engine + Deep Monte Carlo RL agent"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "torch>=2.0",
    "tqdm>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
modal = ["modal>=0.64"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/guandan"]

[tool.pytest.ini_options]
testpaths = ["tests"]
