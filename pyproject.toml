[project]
name = "guandan"
version = "0.1.0"
description = "Guan Dan (掼蛋) game engine + Deep Monte Carlo RL agent"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "torch>=2.0",
    "tqdm>=4.0",
    "pyyaml>=6.0",
    "matplotlib>=3.7",
]

[project.scripts]
guandan-analyze = "guandan.scripts.analyze:main"
guandan-eval-dart = "guandan.scripts.eval.eval_dart:main"
guandan-plot-wr = "guandan.scripts.eval.plot_wr:main"
guandan-wr-matrix = "guandan.scripts.eval.wr_matrix:main"

[project.optional-dependencies]
dev = ["pytest>=7.0"]
modal = ["modal>=0.64"]
llm = ["litellm>=1.50"]
web = [
    "fastapi>=0.104",
    "uvicorn[standard]>=0.29.0",
    "websockets>=12.0",
    "redis>=5.0",
    "motor>=3.3",
    "mongomock-motor>=0.0.35",
    "numpy>=1.24",
    "slowapi>=0.1.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ml/src/guandan", "ml/src/guandan_rs"]
exclude = [
    "ml/src/guandan_rs/Cargo.*",
    "ml/src/guandan_rs/src/**",
    "ml/src/guandan_rs/target/**",
]

[tool.pytest.ini_options]
testpaths = ["ml/tests", "web/backend/tests"]
markers = [
    "slow: spawns subprocesses or takes >5s; opt in with `-m slow`",
]

[dependency-groups]
dev = [
    "fastapi>=0.104",
    "httpx>=0.28.1",
    "maturin>=1.8,<2",
    "mongomock-motor>=0.0.35",
    "motor>=3.3",
    "py-spy>=0.4.2",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "redis>=5.0",
    "slowapi>=0.1.9",
    "uvicorn[standard]>=0.29.0",
    "websockets>=12.0",
]
