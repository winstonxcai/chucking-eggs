[project]
name = "guandan"
version = "0.1.0"
description = "Guan Dan (掼蛋) game engine + Deep Monte Carlo RL agent"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "torch>=2.0",
    "tqdm>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
modal = ["modal>=0.64"]
llm = ["litellm>=1.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ml/src/guandan"]

[tool.pytest.ini_options]
testpaths = ["ml/tests", "web/backend/tests"]
markers = [
    "slow: spawns subprocesses or takes >5s; opt in with `-m slow`",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "py-spy>=0.4.2",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]
